<!doctype html><html lang="ko"><meta charset="utf-8"><title>시험 결과를 숫자로 보여 드려요</title><style>*{box-sizing:border-box;margin:0}html,body{width:652px;height:488px;overflow:hidden}

.xl tr.y td{background:#fff2b3}.big{font-size:40px;font-weight:800;letter-spacing:-1px;color:#5b6b4a}</style><span class=tag>사진 → 엑셀, PC 안에서만</span><h1>시험 결과를 숫자로 보여 드려요</h1><p class=sub>처음 보는 가상 문서 20장을 휴대폰 사진처럼 만들어 시험했어요</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;text-align:center;font-size:12px"><div class=box style="padding:16px 8px"><div class=big>95.9%</div><div style="font-size:13px">칸 415개 중 398개 정답</div></div><div class=box style="padding:16px 8px"><div class=big>19/20</div><div style="font-size:13px">모든 칸이 맞은 문서</div></div><div class=box style="padding:16px 8px"><div class=big>8초</div><div style="font-size:13px">장당 처리 (CPU만)</div></div></div><p style="margin-top:12px;font-size:13px;color:#685e51;line-height:1.6">틀린 1장은 멀리서 찍은 작은 영수증이었고, 문서 전체가 '확인 필요'로 표시됐어요.<br>합성 사진 시험이라 실제 사진은 다를 수 있어요. 주문 전 샘플 5~10장으로 먼저 확인해 드려요.</p><div class=note>화면 속 거래처·금액은 가상입니다 · 최종 범위·비용·일정은 착수 전 합의합니다</div></html>
